[package]
name = "signal-archiver"
version = "0.1.0"
edition = "2024"
description = "Ingests Signal messages from signal-cli-rest-api's receive websocket into MariaDB"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# Plaintext ws:// to the in-cluster signal-cli-rest-api — no TLS feature needed.
tokio-tungstenite = "0.29"
serde_json = "1"
# `derive`, for the irssi plugin's typed tail reply.
serde = { version = "1", features = ["derive"] }
# Plaintext HTTP to signal-cli-rest-api; no TLS. `stream` writes attachments
# chunk by chunk, bounding peak memory.
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
# Runtime SQL only; in-cluster MariaDB is plaintext, so no TLS backend feature.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Telegram's MTProto, as a user client.
grammers-client = "0.10.0"
# Not used directly. grammers-crypto 0.10 asks for `^2.0.0-rc0`, which admits
# rc1, and grammers-crypto does not compile against rc1. This `=` pin holds
# `cargo update` on rc0.
glass_pumpkin = "=2.0.0-rc0"
# The default `sqlite-storage` feature needs a C toolchain and libclang; the
# session lives in MariaDB instead (src/telegram/session.rs), persisted via
# `serde`.
grammers-session = { version = "0.10.0", default-features = false, features = [
  "serde",
] }
# The sender pool that holds the connections; the client is a handle to it.
grammers-mtsender = "0.10.0"
# The raw TL types `map.rs` maps.
grammers-tl-types = "0.10.0"
sha2 = "0.11"

# The fleet's `[lints]` baseline (dev-lint docs/standards.md §7).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
