[package]
name = "signal-archiver"
version = "0.1.0"
edition = "2024"
description = "Ingests Signal messages from signal-cli-rest-api's receive websocket into MariaDB"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# Plaintext ws:// to the in-cluster signal-cli-rest-api — no TLS feature needed.
tokio-tungstenite = "0.29"
serde_json = "1"
# `derive` only: the one typed thing this crate decodes is the irssi plugin's
# tail reply, where a struct is what makes a missing or renamed field a compile
# error rather than a silently absent line.
serde = { version = "1", features = ["derive"] }
# Plaintext HTTP to signal-cli-rest-api (attachment bytes + group names); no TLS.
# `stream` is for `bytes_stream()`: attachment blobs are written chunk by chunk,
# so the pod's peak memory is one chunk rather than the largest file anyone
# sends it — which is what lets the container carry a memory limit at all.
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
# Runtime SQL only; in-cluster MariaDB is plaintext, so no TLS backend feature.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
