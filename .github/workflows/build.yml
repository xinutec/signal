---
name: build

# signal-archiver (Rust) — gate on fmt + clippy + cargo test, then build + push
# xinutec/signal-archiver:latest to Docker Hub. The k8s manifests + deploy live
# in the home monorepo (xinutec/pippijn code/kubes/signal/k8s); the image tag is
# the only contract between this repo and the deploy.
#
# tests/parse.rs and tests/irclog.rs are pure units, but tests/irc_stats.rs is
# not: `irc_conversation_stats` is maintained by DATABASE TRIGGERS, so the only
# thing that can test it is a database. Without the service below that test
# skips itself silently and the triggers ship unverified.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/flake.lock"
  workflow_dispatch: {}

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: signal_test
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      SIGNAL_TEST_DATABASE_URL: mysql://root:root@mariadb:3306/signal_test
    steps:
      - uses: actions/checkout@v6
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  image:
    needs: [verify]
    # Docker Hub auth comes from repo secrets; the GITHUB_TOKEN only reads.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: xinutec/signal-archiver:latest
          cache-from: type=registry,ref=xinutec/signal-archiver:cache
          cache-to: type=registry,ref=xinutec/signal-archiver:cache
